# ESLint (Obytes starter CI, adapted: yarn v1 + corepack disabled).
# TODO(obytes-migration): flip continue-on-error to false once the repo is
# lint-clean — the pre-existing codebase has violations that predate CI.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      COREPACK_ENABLE_STRICT: "0"
      COREPACK_ENABLE_PROJECT_SPEC: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint:check --max-warnings=0
